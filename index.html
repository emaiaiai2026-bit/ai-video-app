<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد الصور بالذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-indigo-300">مولد الصور بالذكاء الاصطناعي</h1>
        
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1 text-slate-300">رابط موقعك:</label>
            <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 flex items-center justify-between">
                <code class="text-xs text-indigo-400 truncate ml-2">https://emaiaiai2026-bit.github.io/ai-video-app/</code>
                <button onclick="navigator.clipboard.writeText('https://emaiaiai2026-bit.github.io/ai-video-app/'); alert('تم النسخ!');" class="bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1 rounded text-xs font-medium shrink-0">
                    📋 نسخ
                </button>
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium mb-2 text-slate-300">مفتاح Hugging Face API Token:</label>
            <input type="password" id="apiToken" placeholder="hf_..." class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg outline-none text-white">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium mb-2 text-slate-300">صف الصورة:</label>
            <textarea id="prompt" rows="3" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg outline-none text-white">A cute cat in space</textarea>
        </div>

        <button onclick="generateImage()" id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium p-3 rounded-lg shadow-lg">
            🎨 توليد الصورة
        </button>

        <div id="status" class="mt-4 text-center text-sm"></div>
        <div id="result" class="mt-4 flex justify-center"></div>
    </div>

    <script>
        async function generateImage() {
            const token = document.getElementById('apiToken').value.trim();
            const promptText = document.getElementById('prompt').value.trim();
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('generateBtn');

            if (!token || !promptText) {
                statusDiv.innerHTML = '<span class="text-red-400">الرجاء إدخال الـ Token ووصف الصورة!</span>';
                return;
            }

            btn.disabled = true;
            btn.innerText = 'جاري التوليد...';
            statusDiv.innerHTML = '<span class="text-yellow-400">⏳ يرجى الانتظار (قد تأخذ وقتاً بسيطاً)...</span>';
            resultDiv.innerHTML = '';

            try {
                // استخدام نموذج Stable Diffusion v1.5 الأكثر استقراراً للـ API المباشر
                const response = await fetch("https://api-inference.huggingface.co/models/runwayml/stable-diffusion-v1-5", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ inputs: promptText })
                });

                if (!response.ok) {
                    throw new Error('خطأ في استجابة الخادم');
                }

                const blob = await response.blob();
                const imageUrl = URL.createObjectURL(blob);

                statusDiv.innerHTML = '<span class="text-green-400">✨ تم بنجاح!</span>';
                resultDiv.innerHTML = `<img src="${imageUrl}" class="w-full rounded-lg shadow-md mt-2" alt="Generated Image">`;
            } catch (error) {
                statusDiv.innerHTML = `<span class="text-red-400">❌ تأكد من صحة الـ Token أو أن حسابك مفعل.</span>`;
            } finally {
                btn.disabled = false;
                btn.innerText = '🎨 توليد الصورة';
            }
        }
    </script>
</body>
</html>
