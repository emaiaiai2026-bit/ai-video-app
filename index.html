<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق توليد الفيديوهات بالذكاء الاصطناعي</title>
    <!-- استخدام Tailwind CSS لتصميم سريع وجميل يناسب الموبايل -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-indigo-400">مولد الفيديوهات بالذكاء الاصطناعي</h1>
        
        <!-- حقل إدخال مفتاح الـ API الخاص بحسابك على Hugging Face -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2 text-gray-300">مفتاح Hugging Face API Token:</label>
            <input type="password" id="apiToken" placeholder="أدخل الـ Token هنا..." 
                class="w-full p-3 bg-gray-900 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500 text-sm">
        </div>

        <!-- حقل إدخال الوصف (Prompt) للفيديو -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2 text-gray-300">صف الفيديو الذي تريده:</label>
            <textarea id="promptInput" rows="3" placeholder="مثال: A cinematic shot of a futuristic city..." 
                class="w-full p-3 bg-gray-900 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500 text-sm"></textarea>
        </div>

        <!-- زر التوليد -->
        <button onclick="generateVideo()" id="generateBtn" 
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-3 rounded-lg transition duration-200">
            توليد الفيديو 🎬
        </button>

        <!-- منطقة عرض الحالة أو النتيجة -->
        <div id="resultArea" class="mt-6 text-center text-sm text-gray-400"></div>
    </div>

    <script>
        async function generateVideo() {
            const apiToken = document.getElementById('apiToken').value.trim();
            const prompt = document.getElementById('promptInput').value.trim();
            const resultArea = document.getElementById('resultArea');
            const btn = document.getElementById('generateBtn');

            if (!apiToken || !prompt) {
                alert('الرجاء إدخال مفتاح الـ Token ووصف الفيديو!');
                return;
            }

            resultArea.innerHTML = "⏳ جاري إرسال الطلب ومعالجة الفيديو... يرجى الانتظار.";
            btn.disabled = true;
            btn.classList.add('opacity-50');

            try {
                // سنقوم بربط هذا الزر بنموذج مجاني مباشر عبر Hugging Face API في الخطوة القادمة
                // هذا كود تجريبي لاختبار استجابة الواجهة
                setTimeout(() => {
                    resultArea.innerHTML = "✅ تم استلام الطلب بنجاح! سيتم ربط النتيجة الفعلية بالخطوة القادمة.";
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');
                }, 2000);

            } catch (error) {
                resultArea.innerHTML = "❌ حدث خطأ: " + error.message;
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
